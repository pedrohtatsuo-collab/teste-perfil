<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Jeito, Seu Jeito — Teste de Perfil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&display=swap">
<style>
:root{--bg:#F6F6F7;--card:#FFFFFF;--tx:#16161A;--mut:#5B5B63;--line:#E1E1E5;--red:#D50F1E;--redtx:#C40D1B;--on:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1A1A;--card:#262626;--tx:#F5F5F5;--mut:#B8B8BE;--line:#3A3A3A;--redtx:#FF4550}}
:root[data-theme="dark"]{--bg:#1A1A1A;--card:#262626;--tx:#F5F5F5;--mut:#B8B8BE;--line:#3A3A3A;--redtx:#FF4550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;line-height:1.4;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.kick{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--redtx);font-weight:700;margin:0 0 8px}
h1,h2{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;line-height:1.05;margin:0 0 14px}
h1{font-size:46px}h2{font-size:30px}
p{margin:0 0 14px}.mut{color:var(--mut)}
.rule{width:80px;height:5px;background:var(--red);margin:14px 0 20px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0 18px}
button{font:inherit;cursor:pointer}
.btn{width:100%;background:var(--red);color:var(--on);border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:2px solid var(--line);margin-top:12px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 24px}
.bar i{display:block;height:100%;background:var(--red);transition:width .25s}
.opt{display:block;width:100%;text-align:center;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:14px;padding:18px 12px;font-size:20px;font-weight:600;margin:0 0 12px}
.opt.sel{border-color:var(--red);background:var(--red);color:var(--on)}
.back{background:none;border:0;color:var(--mut);font-size:15px;padding:8px 0}
.badge{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:56px;font-weight:700;margin:6px 0 14px}
.row{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:15px}
.row b{width:22px;font-family:'Oswald',sans-serif;font-size:20px}
.track{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}.track i{display:block;height:100%;border-radius:8px}
.row span{width:44px;text-align:right;color:var(--mut)}
.box{background:var(--card);border-left:6px solid var(--red);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.box h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--redtx)}
.box ul{margin:0;padding-left:20px}.box p{margin:0}
.small{font-size:13px;color:var(--mut);margin-top:22px}
</style></head><body><div class="wrap" id="app"></div>
<script>
var Q=[[["Decidido","D"],["Cuidadoso","C"],["Animado","I"],["Calmo","S"]],[["Ousado","D"],["Leal","S"],["Analítico","C"],["Sociável","I"]],[["Alegre","I"],["Direto","D"],["Paciente","S"],["Detalhista","C"]],[["Falante","I"],["Firme","D"],["Organizado","C"],["Gentil","S"]],[["Estável","S"],["Simpático","I"],["Corajoso","D"],["Preciso","C"]],[["Metódico","C"],["Otimista","I"],["Objetivo","D"],["Amigável","S"]],[["Ágil","D"],["Criterioso","C"],["Tranquilo","S"],["Carismático","I"]],[["Cauteloso","C"],["Divertido","I"],["Líder","D"],["Pacífico","S"]],[["Focado","D"],["Lógico","C"],["Empolgado","I"],["Confiável","S"]],[["Atencioso","S"],["Racional","C"],["Rápido","D"],["Criativo","I"]],[["Rigoroso","C"],["Moderado","S"],["Forte","D"],["Popular","I"]],[["Meticuloso","C"],["Expressivo","I"],["Constante","S"],["Dinâmico","D"]],[["Planejador","C"],["Prestativo","S"],["Resoluto","D"],["Entusiasta","I"]],[["Observador","C"],["Prático","D"],["Persuasivo","I"],["Acolhedor","S"]],[["Reservado","C"],["Tolerante","S"],["Pioneiro","D"],["Encantador","I"]],[["Prudente","C"],["Dedicado","S"],["Enérgico","D"],["Espontâneo","I"]],[["Pontual","C"],["Inspirador","I"],["Vencedor","D"],["Sereno","S"]],[["Seguro","D"],["Motivador","I"],["Exato","C"],["Humilde","S"]],[["Receptivo","I"],["Correto","C"],["Incisivo","D"],["Fiel","S"]],[["Agradável","I"],["Solidário","S"],["Técnico","C"],["Arrojado","D"]]];
var C={D:'#E31B23',I:'#FFC20E',S:'#2BB24C',C:'#1E73D2'};
var P={
D:{n:'Dominante',t:'Foco em resultado, rapidez e controle.',f:['Decide rápido','Assume desafios','Foca na meta'],a:['Impaciente','Pouco detalhista','Pode parecer duro'],l:'Seja direto, mostre o objetivo e dê autonomia.'},
I:{n:'Influente',t:'Foco em pessoas, energia e conexão.',f:['Comunica bem','Motiva o time','Cria vínculo'],a:['Dispersa','Perde detalhes','Fala mais do que ouve'],l:'Use um clima leve, reconheça e dê espaço para falar.'},
S:{n:'Estável',t:'Foco em harmonia, constância e apoio.',f:['Ouve com atenção','É leal e confiável','Mantém o ritmo'],a:['Resiste a mudanças','Evita confronto','Demora a dizer não'],l:'Tenha paciência, dê tempo para se adaptar e passe segurança.'},
C:{n:'Conforme',t:'Foco em qualidade, regras e precisão.',f:['É analítico','Cuida dos detalhes','Planeja bem'],a:['Perfeccionista','Demora sem dados','Pode ser crítico'],l:'Traga dados, critérios claros e tempo para analisar.'}};
var st={i:-1,a:[],name:''};
var app=document.getElementById('app');
function li(a){return a.map(function(x){return '<li>'+x+'</li>'}).join('')}
function start(){
 app.innerHTML='<p class="kick">Tatsuo Academy</p><h1>Meu Jeito,<br>Seu Jeito</h1><div class="rule"></div><p><b>Teste do perfil comportamental</b><br><span class="mut">20 perguntas · cerca de 5 minutos</span></p><p class="mut">Em cada pergunta, escolha a palavra que mais combina com você, e não a que acha mais bonita.</p><label class="mut" for="nm">Seu nome (opcional)</label><input id="nm" type="text" autocomplete="off" placeholder="Digite seu nome"><button class="btn" id="go">Começar</button>';
 document.getElementById('go').onclick=function(){st={i:0,a:[],name:document.getElementById('nm').value.trim()};quiz()};
}
function quiz(){
 var q=Q[st.i],h='<p class="kick">Pergunta '+(st.i+1)+' de '+Q.length+'</p><div class="bar"><i style="width:'+(st.i/Q.length*100)+'%"></i></div><h2>Qual palavra melhor te descreve?</h2>';
 q.forEach(function(o,j){h+='<button class="opt'+(st.a[st.i]===j?' sel':'')+'" data-j="'+j+'">'+o[0]+'</button>'});
 h+=(st.i>0?'<button class="back" id="bk">← Voltar</button>':'');
 app.innerHTML=h;
 Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){st.a[st.i]=+b.getAttribute('data-j');b.classList.add('sel');setTimeout(function(){if(st.i<Q.length-1){st.i++;quiz()}else{result()}},160)}});
 var bk=document.getElementById('bk');if(bk)bk.onclick=function(){st.i--;quiz()};
 window.scrollTo(0,0);
}
function result(){
 var s={D:0,I:0,S:0,C:0};st.a.forEach(function(j,i){s[Q[i][j][1]]++});
 var m=Math.max(s.D,s.I,s.S,s.C),top=['D','I','S','C'].filter(function(k){return s[k]===m});
 var main=top[0],title=top.map(function(k){return P[k].n}).join(' + ');
 var h='<p class="kick">'+(st.name?'Resultado de '+st.name:'Seu resultado')+'</p><div class="badge" style="background:'+C[main]+';color:'+(main==='I'?'#1A1A1A':'#FFFFFF')+'">'+top.join('')+'</div><h2>'+(top.length>1?'Perfil combinado: ':'Perfil ')+title+'</h2>';
 if(top.length>1)h+='<p class="mut">Você empatou entre '+top.length+' perfis: os traços dos dois aparecem com força em você.</p>';
 ['D','I','S','C'].forEach(function(k){h+='<div class="row"><b style="color:'+C[k]+'">'+k+'</b><div class="track"><i style="width:'+(s[k]/Q.length*100)+'%;background:'+C[k]+'"></i></div><span>'+s[k]+'/'+Q.length+'</span></div>'});
 top.forEach(function(k){var p=P[k];h+='<div class="box" style="margin-top:18px"><h3>'+p.n+'</h3><p>'+p.t+'</p></div><div class="box"><h3>Pontos fortes</h3><ul>'+li(p.f)+'</ul></div><div class="box"><h3>Pontos de atenção</h3><ul>'+li(p.a)+'</ul></div><div class="box"><h3>Como lidar com esse perfil</h3><p>'+p.l+'</p></div>'});
 h+='<button class="btn" id="again">Próxima pessoa</button><p class="small">Exercício de autoconhecimento. Não é um teste psicológico validado. Todos temos um pouco de cada perfil.</p>';
 app.innerHTML=h;document.getElementById('again').onclick=start;window.scrollTo(0,0);
}
start();
</script></body></html>
